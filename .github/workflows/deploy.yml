name: Mise en ligne

# À chaque push sur main, demande au VPS de récupérer la dernière version du site.
# La clé VPS_SSH_KEY ne peut lancer que `systemctl start site-pull@portfolio.service` sur le serveur.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mise-en-ligne
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mettre à jour le site sur le VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes ubuntu@179.237.98.117

      - name: Vérifier la version en ligne
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://tanguym.fr/app.js" -o /dev/null; then exit 0; fi
            sleep 5
          done
          echo "Le site ne répond pas." >&2
          exit 1
